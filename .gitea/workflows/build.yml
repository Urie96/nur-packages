name: "Build and populate cache"
on:
  push:
    branches:
      - main
      - master

# One run per push, but never cancel a running one: these jobs exist to warm the
# runners' stores, and a cancelled build leaves the store only partly populated.
# (Runs are queued, jobs inside a run still run in parallel.)
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # The evaluation check runs on pull requests (pr.yml), so a merge only lands
    # here after it has passed. This job only populates the cache.
    #
    # One leg per runner architecture. Each leg builds natively on its own
    # machine; ci.nix filters the package set by meta.platforms (and
    # meta.broken/license), so every leg builds the subset that is available on
    # its platform and `checks.$system.all` never asks for a foreign-arch build.
    strategy:
      # A failing package on arm must not cancel the x86 leg (and vice versa):
      # warming either store is still useful.
      fail-fast: false
      matrix:
        system:
          - x86_64-linux
          - aarch64-linux
          - aarch64-darwin
    # Label of the runner, i.e. `x86_64-linux` and `aarch64-linux` must exist as
    # runner labels in Gitea.
    runs-on: ${{ matrix.system }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build (${{ matrix.system }})
        run: |
          set -euo pipefail
          nix build --keep-going -o result .#checks.${{ matrix.system }}.all
          echo "### ${{ matrix.system }} closure size"
          nix path-info -Sh ./result

      # 私钥来自仓库 secret CACHE_PUSH_SSH_KEY（对应 cache-push@home.lubui.com 的
      # authorized_keys）。写入临时文件后通过 NIX_SSHOPTS 传给 nix 的 ssh transport。
      # x86_64-linux leg 不推：这台机器自己就能原生构建，推过去没收益。
      - name: Push closure to cache (${{ matrix.system }})
        if: matrix.system != 'x86_64-linux'
        env:
          CACHE_PUSH_SSH_KEY: ${{ secrets.CACHE_PUSH_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${CACHE_PUSH_SSH_KEY:-}" ]; then
            echo "CACHE_PUSH_SSH_KEY is empty, refusing to continue" >&2
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.ssh"
          key="${RUNNER_TEMP:-/tmp}/cache_push_key"
          printf '%s\n' "$CACHE_PUSH_SSH_KEY" > "$key"
          trap 'rm -f "$key"' EXIT
          unset CACHE_PUSH_SSH_KEY
          # 首次连接先学习主机公钥；scan 失败再退回 accept-new，避免 keyscan 抖动导致失败
          ssh-keyscan home.lubui.com > "$HOME/.ssh/known_hosts" 2>/dev/null || true
          export NIX_SSHOPTS="-i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          nix copy --to ssh-ng://cache-push@home.lubui.com ./result
