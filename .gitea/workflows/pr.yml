name: "PR check"

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
      - master

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    # Required status check on main: its context is
    #   "PR check / check (pull_request)"
    # (Gitea reports "<workflow name> / <job name> (<event>)").
    runs-on: x86_64-linux
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check evaluation
        run: nix flake check --no-build --keep-going --all-systems

  auto-merge:
    needs: check
    # Only pull requests the updater opted in with the "auto-merge" label, and
    # only from branches in this repository (fork PRs get no secrets).
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'auto-merge')
    runs-on: x86_64-linux
    steps:
      - name: Schedule auto-merge
        # Native Gitea auto-merge: schedule once, Gitea merges as soon as all
        # required status checks (i.e. the `check` job above) are green.
        # A real user PAT is required: events caused by the job token
        # (gitea-actions) never trigger workflows, and whoever schedules the
        # merge is the pusher of the merge commit, so the push to main must
        # not come from the actions user either (otherwise build.yml's push
        # trigger is ignored).
        env:
          TOKEN: ${{ secrets.BOT_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
        run: |
          set -eu
          [ -n "${TOKEN:-}" ] || { echo "missing secrets.BOT_TOKEN"; exit 1; }

          code=$(curl -sS -o /tmp/response -w '%{http_code}' -X POST \
            -H "Authorization: token $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"Do":"merge","merge_when_checks_succeed":true,"delete_branch_after_merge":true}' \
            "$API/pulls/$PR/merge")

          cat /tmp/response; echo
          case "$code" in
            201) echo "auto-merge scheduled for PR #$PR" ;;
            409) echo "auto-merge already scheduled for PR #$PR" ;;
            *)   echo "failed to schedule auto-merge: HTTP $code"; exit 1 ;;
          esac
