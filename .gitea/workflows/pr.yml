name: "PR check"

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
      - master

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    # Required status check on main: its context is
    #   "PR check / check (pull_request)"
    # (Gitea reports "<workflow name> / <job name> (<event>)").
    #
    # Both the evaluation and the build live in this job on purpose: the build
    # gate is then part of the already-required check, so a merge cannot land
    # before every package in ci.x86_64-linux.all has built.
    runs-on: x86_64-linux
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check evaluation
        # Evaluates the whole flake (all systems) without building; catches
        # eval errors and broken meta early, before the expensive build.
        run: nix flake check --no-build --keep-going --all-systems

      - name: Build all packages
        # Same command that used to run on push to main (build.yml): this is
        # what populates the cache for the runner's store. Building on the PR
        # head is equivalent because the merged tree equals the PR head (see
        # "require up-to-date branch" in the branch protection settings).
        run: nix build --no-link --keep-going .#ci.x86_64-linux.all

  auto-merge:
    needs: check
    # Only pull requests opted in with the "auto-merge" label (the updater adds
    # it to its PRs, nightly-pr.yml adds it to the nightly branch PR), and only
    # from branches in this repository (fork PRs get no secrets).
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'auto-merge')
    runs-on: x86_64-linux
    steps:
      - name: Schedule auto-merge
        env:
          TOKEN: ${{ secrets.BOT_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
        run: |
          set -eu
          [ -n "${TOKEN:-}" ] || { echo "missing secrets.BOT_TOKEN"; exit 1; }

          # Every PR branch is one-shot: drop it after merging. That lets the
          # updater open a fresh PR for a package next time, and `daily` is
          # recreated by your next push to it.
          #
          # `"Do":"merge"` is deliberate: a merge commit keeps the commits of
          # the PR branch as ancestors of main, so once the branch is recreated
          # from an older local tip, `main..daily` still contains only the new
          # commits and a fresh PR gets a clean diff.
          code=$(curl -sS -o /tmp/response -w '%{http_code}' -X POST \
            -H "Authorization: token $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"Do":"merge","merge_when_checks_succeed":true,"delete_branch_after_merge":true}' \
            "$API/pulls/$PR/merge")

          cat /tmp/response; echo
          case "$code" in
            201) echo "auto-merge scheduled for PR #$PR" ;;
            200) echo "PR #$PR was merged immediately" ;;
            409) echo "auto-merge already scheduled for PR #$PR" ;;
            *)   echo "failed to schedule auto-merge: HTTP $code"; exit 1 ;;
          esac
