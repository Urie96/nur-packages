name: "CI smoke test (no updates)"

# Throwaway workflow to verify the plumbing before letting the updater run:
#   * the job token gets persisted by actions/checkout and can push
#   * pushing from a `git worktree` works (that is how the updater pushes)
#   * tea authenticates from env vars and can read the API
#   * the flake builds `.#updater`
# It never bumps a package. Everything it creates is deleted again.
#
# Optional: run with test_pr=true to also create + close a throwaway PR.

on:
  workflow_dispatch:
    inputs:
      test_pr:
        description: "Also create and immediately close a throwaway PR"
        type: string
        default: "false"

jobs:
  smoke:
    runs-on: x86_64-linux
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      # tea reads credentials from the environment (no `tea login` needed).
      # GITEA_INSTANCE_URL is for tea 0.15+, TEA_HOST for tea 1.x.
      GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
      GITEA_INSTANCE_URL: ${{ github.server_url }}
      TEA_HOST: ${{ github.server_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Context and tool versions
        run: |
          set -eu
          nix --version
          git --version
          echo "server:     $GITHUB_SERVER_URL"
          echo "repository: $GITHUB_REPOSITORY"
          echo "ref:        $GITHUB_REF"
          echo "sha:        $(git rev-parse --short HEAD)"
          if [ -n "${GITEA_TOKEN:-}" ]; then
            echo "GITEA_TOKEN: set (${#GITEA_TOKEN} chars)"
          else
            echo "GITEA_TOKEN: MISSING — repository/user Actions settings?"
            exit 1
          fi

      - name: Credentials persisted by actions/checkout
        run: |
          set -eu
          creds="$(git config --local --get-regexp '^http\..*\.extraheader$' || true)"
          if [ -n "$creds" ]; then
            printf '%s\n' "$creds" | sed -E 's/(AUTHORIZATION: basic ).*/\1***/'
          else
            echo "(no http.<server>/.extraheader in .git/config)"
          fi
          git config --local --get-regexp '^includeIf\.gitdir:' || echo "(no includeIf entries)"

      - name: Resolve tea from the flake's nixpkgs
        run: |
          set -eu
          tea_path="$(nix build --inputs-from . --no-link --print-out-paths nixpkgs#tea)"
          echo "TEA=$tea_path/bin/tea" >> "$GITHUB_ENV"
          "$tea_path/bin/tea" --version

      - name: Read-only tea API check
        run: |
          set -eu
          "$TEA" pulls list --repo "$GITHUB_REPOSITORY" --state all --limit 3

      - name: Updater flake builds (nothing is updated)
        run: nix run .#updater -- --list

      - name: Push a throwaway branch from a git worktree
        id: push
        run: |
          set -eu
          branch="ci-smoke-${GITHUB_RUN_ID:-0}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git worktree add -b "$branch" /tmp/smoke-wt
          cd /tmp/smoke-wt
          date -u > ci-smoke.txt
          git add ci-smoke.txt
          git -c user.name="gitea-actions[bot]" -c user.email="noreply@local" \
            commit -m "ci: smoke test commit"
          git push -u origin "$branch"

      - name: "Create a throwaway PR (run with test_pr=true)"
        if: inputs.test_pr == 'true'
        id: pr
        run: |
          set -u
          cd /tmp/smoke-wt
          title="ci: smoke test ${{ steps.push.outputs.branch }}"
          body="Throwaway PR from the smoke workflow. Safe to close."
          create() {
            "$TEA" pulls create --remote origin --repo "$GITHUB_REPOSITORY" \
              --title "$title" --description "$body" "$@" 2>&1
          }
          # First exactly what the updater does, label included...
          if out="$(create --labels auto-merge)"; then
            echo "create with --labels auto-merge: ok (label exists)"
          else
            printf '%s\n' "$out"
            echo "::warning:: --labels auto-merge rejected; the updater retries without labels, doing the same"
            out="$(create)" || { printf '%s\n' "$out"; echo "create without labels failed too"; exit 1; }
          fi
          printf '%s\n' "$out"
          # tea prints either the PR URL or "Created pull request #N"
          idx="$(printf '%s\n' "$out" | grep -oE '(/pulls/|#)[0-9]+' | tail -1 | tr -dc '0-9')"
          if [ -n "$idx" ]; then
            echo "index=$idx" >> "$GITHUB_OUTPUT"
          else
            echo "::warning:: could not parse the PR index; close it by hand"
          fi

      - name: Cleanup (close test PR, delete branch and worktree)
        if: always()
        env:
          BRANCH: ${{ steps.push.outputs.branch }}
          PR_INDEX: ${{ steps.pr.outputs.index }}
        run: |
          set -u
          if [ -n "${PR_INDEX:-}" ] && [ -n "${TEA:-}" ]; then
            "$TEA" pulls close --repo "$GITHUB_REPOSITORY" "$PR_INDEX" \
              || echo "warning: could not close PR #$PR_INDEX"
          fi
          git worktree remove --force /tmp/smoke-wt 2>/dev/null || true
          if [ -n "${BRANCH:-}" ] && git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git push origin --delete "$BRANCH" || echo "warning: could not delete $BRANCH"
          fi
