name: "Update packages and open PRs"

on:
  schedule:
    # every 5 hours, offset from the top of the hour (UTC)
    - cron: "17 */5 * * *"
  workflow_dispatch:

concurrency:
  group: update-packages
  cancel-in-progress: false

jobs:
  update:
    runs-on: x86_64-linux
    # First runs download every upstream artifact to compute hashes; the nix
    # store caches them, so later runs are much faster.
    timeout-minutes: 180
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      # PRs are opened through the Gitea HTTP API, so the updater only needs a
      # token plus the instance URL. `GITEA_INSTANCE_URL` is what it reads;
      # `TEA_HOST` is kept as the legacy alias for older checkouts.
      #
      # Deliberately a real user's PAT, not `secrets.GITEA_TOKEN`: the job
      # token acts as the `gitea-actions` user and events caused by it never
      # trigger workflows (to prevent loops), so a PR opened with it would get
      # no `pull_request` run and thus no required check to wait for. The same
      # token is what opens the PR and schedules its auto-merge. Must match the
      # token used by .gitea/workflows/pr.yml.
      GITEA_TOKEN: ${{ secrets.BOT_TOKEN }}
      GITEA_INSTANCE_URL: ${{ github.server_url }}
      TEA_HOST: ${{ github.server_url }}
      # author identity for the update commits
      UPDATER_GIT_NAME: "gitea-actions[bot]"
      UPDATER_GIT_EMAIL: "gitea-actions[bot]@noreply.local"
    steps:
      - name: Checkout repository
        # Keeps `persist-credentials` at its default (true): checkout stores the
        # job token in a git config file included for this repo *and* its
        # worktrees, so the plain `git push` done by the updater authenticates
        # on its own. The job token is the credential, granted by `permissions`.
        # Pushing the update branch as `gitea-actions` is fine — what matters
        # for triggering the PR workflow is the author of the pull request
        # itself, which is `secrets.BOT_TOKEN` above.
        uses: actions/checkout@v4
        with:
          # nix resolves the flake through git; with a shallow clone (checkout's
          # default) evaluating the *worktree* the updater creates fails with
          # "getting Git object '<parent>': object not found", because libgit2
          # cannot see the shallow boundary from inside a worktree.
          fetch-depth: 0

      - name: Set commit identity
        run: |
          set -eu
          git config user.name "$UPDATER_GIT_NAME"
          git config user.email "$UPDATER_GIT_EMAIL"

      - name: Update packages and open PRs
        # `--auto-merge` schedules Gitea's native auto-merge on every PR it
        # opens (POST /pulls/{n}/merge with merge_when_checks_succeed), so a PR
        # lands by itself once "PR check / check (pull_request)" is green — no
        # second workflow and no `auto-merge` label involved.
        run: nix run .#updater -- --pr --auto-merge
