name: "Nightly PR from daily branch"

# Opens (at most) one pull request per night from the branch you push your
# everyday work to, and schedules Gitea's native auto-merge on it: pr.yml runs
# the checks and the branch lands on main without any manual step.
#
# All the "is there anything to do" logic lives in the action: it does nothing
# when `daily` does not exist, when it is already contained in `main`, or when
# the pull request is already open (it just re-schedules the merge).
#
# This exists because a pull_request only re-runs on `synchronize` while a PR is
# open: once the previous PR is merged there is no PR left, so further pushes to
# the branch would not trigger any check until a new PR is opened.
#
# The PR branch is deleted after the merge, so `daily` only exists remotely while
# there is something to merge; your next push recreates it.

on:
  schedule:
    # every day at 18:00 UTC (02:00 Asia/Shanghai)
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-pr
  cancel-in-progress: false

jobs:
  open-pr:
    runs-on: x86_64-linux
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Opens the pull request (reusing the open one from an earlier run) and
      # schedules `merge_when_checks_succeed` on it; Gitea completes the merge
      # as soon as "PR check / check (pull_request)" is green, so pr.yml needs no
      # merge job of its own.
      #
      # The action needs a real user's PAT, not the job token: events caused by
      # the `gitea-actions` user never trigger workflows, so a PR opened with the
      # job token would get no checks to wait for.
      - name: Open pull request and schedule auto-merge
        uses: urie96/gitea-pr@v1
        with:
          token: ${{ secrets.BOT_TOKEN }}
          head: daily
          base: main
          title: Nightly merge daily into main
          # Created by the action if the repository has no such label yet.
          labels: automated
          merge-method: merge
          delete-branch: true
